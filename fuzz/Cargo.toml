[package]
name = "gcoms-parser-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
gcoms-core = { path = "../crates/core" }
gcoms-protocol = { path = "../crates/protocol" }
gcoms-rpc-contract = { path = "../crates/rpc-contract" }
serde_json = "1"

[[bin]]
name = "cells"
path = "fuzz_targets/cells.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
