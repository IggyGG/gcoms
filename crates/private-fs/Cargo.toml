[package]
name = "gcoms-private-fs"
readme = "README.md"
documentation = "https://docs.rs/gcoms-private-fs"
description = "Shared current-user filesystem ownership and ACL checks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile = "3"
