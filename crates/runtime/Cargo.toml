[package]
name = "gcoms-runtime"
description = "Persistent application runtime for embedded and shared GComs hosts"
readme = "README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gcoms-node = { version = "0.1.0", path = "../node", features = ["client-persist"] }
gcoms-sdk = { version = "0.1.0", path = "../sdk" }
gcoms-network-client = { version = "0.1.0", path = "../network-client" }
gcoms-routing = { version = "0.1.0", path = "../routing" }
gcoms-transport = { version = "0.1.0", path = "../transport" }
gcoms-crypto = { version = "0.1.0", path = "../crypto" }
gcoms-private-fs = { version = "0.1.0", path = "../private-fs" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
fs2 = "0.4"
subtle = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
base64 = "0.22"

[dev-dependencies]
gcoms-core = { version = "0.1.0", path = "../core" }
axum = "0.8"
