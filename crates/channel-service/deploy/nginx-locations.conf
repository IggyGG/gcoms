# Include inside the existing signed origin's HTTPS server. Keep its WebPKI
# certificate, upstream timeouts and stripped forwarding headers. No access log.
# Both paths must reach the same single-writer service and durable volume.
location = /v1/hosted {
    limit_except POST { deny all; }
    client_max_body_size 4m;
    client_body_buffer_size 64k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    access_log off;
    add_header Cache-Control no-store always;
    proxy_pass http://127.0.0.1:18081;
}
location = /v1/hosted/bulk {
    limit_except POST { deny all; }
    client_max_body_size 4m;
    client_body_buffer_size 64k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    access_log off;
    add_header Cache-Control no-store always;
    proxy_pass http://127.0.0.1:18081;
}
