[package]
name = "gcoms-channel-service"
readme = "README.md"
description = "Ciphertext-only ordered storage for experimental hosted GComs channels"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["http"]
http = ["dep:gcoms-sdk", "dep:base64", "dep:serde", "dep:serde_json", "dep:axum", "dep:tokio"]

[[bin]]
name = "gcoms-channel-service"
path = "src/main.rs"
required-features = ["http"]

[dependencies]
gcoms-sdk = { version = "0.1.0", path = "../sdk", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
axum = { version = "0.8", features = ["http1", "json", "tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"], optional = true }

gcoms-mls = { version = "0.1.0", path = "../mls", features = ["hosted-channels"] }
gcoms-private-fs = { version = "0.1.0", path = "../private-fs" }
sha2 = "0.10"
tls_codec = { version = "0.5", features = ["derive", "mls"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
gcoms-mls = { version = "0.1.0", path = "../mls", features = ["hosted-channels", "client-persist"] }
gcoms-crypto = { version = "0.1.0", path = "../crypto" }
tempfile = "3"

