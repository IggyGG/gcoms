[package]
name = "gcoms-routing"
readme = "README.md"
documentation = "https://docs.rs/gcoms-routing"
description = "Private relay introductions and independently authenticated onion circuits"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gcoms-core = { version = "0.1.0", path = "../core", optional = true }
gcoms-transport = { version = "0.1.0", path = "../transport" }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "io-util", "sync"] }
tokio-rustls = "0.26"
h2 = "0.4"
http = "1"
bytes = "1"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
webpki-roots = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
gcoms-core = { version = "0.1.0", path = "../core" }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

[features]
experimental-gc2 = ["dep:gcoms-core", "gcoms-core/experimental-gc2", "gcoms-transport/experimental-gc2", "dep:futures-util"]
