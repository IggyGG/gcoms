[package]
name = "gcoms"
description = "Application communication over embedded or shared GComs runtimes"
readme = "README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
files = ["gcoms-runtime?/files", "tokio/fs"]
embedded = ["dep:gcoms-runtime", "gcoms-runtime/relay-host", "gcoms-sdk/embedded", "dep:fs2"]
network-client = ["dep:gcoms-runtime", "gcoms-sdk/in-process", "gcoms-runtime/gc2-carrier", "dep:fs2"]
ipc = ["gcoms-sdk/ipc"]
launch = ["ipc", "dep:fs2", "tokio/process"]
daemon = ["embedded", "ipc", "tokio/signal", "tokio/rt-multi-thread"]
rpc = ["dep:gcoms-rpc", "gcoms-rpc/native", "gcoms-rpc/file-store", "dep:argon2"]
gc2-carrier = ["embedded", "gcoms-runtime/gc2-carrier"]
wasm = ["dep:gcoms-rpc", "gcoms-rpc/wasm"]

[dependencies]
gcoms-rpc = { version = "0.1.0", path = "../rpc", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gcoms-sdk = { version = "0.1.0", path = "../sdk", default-features = false }
gcoms-runtime = { version = "0.1.0", path = "../runtime", optional = true, default-features = false }
gcoms-private-fs = { version = "0.1.0", path = "../private-fs" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
zeroize = "1"
rand = "0.8"
fs2 = { version = "0.4", optional = true }
tempfile = "3"
sha2 = "0.10"
argon2 = { version = "0.5", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
base64 = "0.22"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[[bin]]
name = "gcomsd"
path = "src/bin/gcomsd.rs"
required-features = ["daemon"]


[[example]]
name = "open"
required-features = ["embedded", "ipc", "rpc", "launch"]

[[test]]
name = "backends"
required-features = ["embedded", "ipc", "rpc", "launch", "daemon"]
