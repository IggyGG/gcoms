[package]
name = "gcoms-transport"
readme = "README.md"
documentation = "https://docs.rs/gcoms-transport"
description = "GComs GC/1 TP-1 transport: TLS 1.3 hybrid + HTTP/2 camouflage + decoy surface"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gcoms-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "io-util"] }
tokio-rustls = "0.26"
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std"] }
h2 = "0.4"
http = "1"
bytes = "1"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
rand = "0.8"
sha2 = "0.10"
x509-parser = "0.18"
zeroize = "1"
base64ct = { version = "1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "io-util", "test-util"] }
gcoms-crypto = { version = "0.1.0", path = "../crypto", default-features = false, features = ["tls-pin"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
