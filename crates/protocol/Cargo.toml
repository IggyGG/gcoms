[package]
name = "gcoms-protocol"
readme = "README.md"
documentation = "https://docs.rs/gcoms-protocol"
description = "Runtime-free GC/1 contact, direct-message, and relay wire codecs"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gcoms-core = { version = "0.1.0", path = "../core", default-features = false }
gcoms-crypto = { version = "0.1.0", path = "../crypto", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"], optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }

[features]
default = ["std"]
std = ["gcoms-core/std", "gcoms-crypto/std", "sha2/std"]

# Unqualified wire codecs; production runtime selection remains GC/1.
experimental-gc2 = ["gcoms-core/experimental-gc2", "dep:aes-gcm", "dep:hkdf", "dep:rand_core", "dep:zeroize"]
# Authenticated peer sessions with caller-owned clocks, entropy and storage.
# The installer can use the same transactional session without a std runtime.
gc2-session = ["experimental-gc2", "gcoms-crypto/sealed-state"]

[dev-dependencies]
rand = "0.8"
