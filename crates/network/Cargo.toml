[package]
name = "gcoms-network"
readme = "README.md"
documentation = "https://docs.rs/gcoms-network"
description = "Signed public network defaults and private network invitation envelope"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
gcoms-crypto = { version = "0.1.0", path = "../crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
