[package]
name = "gcoms-rpc-contract"
readme = "README.md"
documentation = "https://docs.rs/gcoms-rpc-contract"
description = "Portable typed service wire contracts for GC"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
