[package]
name = "gcoms-core"
readme = "README.md"
documentation = "https://docs.rs/gcoms-core"
description = "GComs GC/1 wire format: cells, buckets, fragmentation"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64ct = { version = "1", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[features]
default = ["std"]
std = ["sha2/std"]
