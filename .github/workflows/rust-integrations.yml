name: Rust application integrations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'examples/rust-integration/**'
      - 'scripts/check-rust-integrations.py'
      - '.github/workflows/rust-integrations.yml'
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Prepare short private test directory
        run: mkdir -p /tmp/gcoms-tests && chmod 700 /tmp/gcoms-tests
      - name: Check real native backends
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
          TMPDIR: /tmp/gcoms-tests
        run: cargo test --locked -p gcoms -p gcoms-runtime -p gcoms-sdk -p gcoms-file-transfer --all-features -- --test-threads=1
      - name: Check and measure isolated consumer graphs
        env:
          CARGO_BUILD_JOBS: '2'
        run: python3 scripts/check-rust-integrations.py --measure --output integration-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-integrations-${{ matrix.runner }}-${{ github.sha }}
          path: integration-evidence/
          if-no-files-found: error
