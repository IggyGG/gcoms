name: Rust application integrations
run-name: GComs SDK Rust ${{ inputs.request_id || github.sha }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'examples/rust-integration/**'
      - 'scripts/check-rust-integrations.py'
      - 'scripts/prepare-rust-tests.py'
      - '.github/workflows/rust-integrations.yml'
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
        include:
          - runner: ubuntu-24.04
            baseline: linux-x86_64
          - runner: macos-15
            baseline: darwin-arm64
          - runner: macos-15-intel
            baseline: darwin-x86_64
          - runner: windows-2022
            baseline: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Prepare short private test directory
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prepare-rust-tests.py
      - name: Check real native backends
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo test --locked -p gcoms -p gcoms-runtime -p gcoms-sdk -p gcoms-file-transfer --all-features -- --test-threads=1
      - name: Check and measure isolated consumer graphs
        env:
          CARGO_BUILD_JOBS: '2'
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check-rust-integrations.py --measure --output integration-evidence --baseline docs/evidence/rust-integrations-20260921/${{ matrix.baseline }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-integrations-${{ matrix.runner }}-${{ github.sha }}
          path: integration-evidence/
          if-no-files-found: error
