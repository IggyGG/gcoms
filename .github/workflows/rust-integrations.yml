name: Rust application integrations
run-name: GComs SDK Rust ${{ inputs.request_id || github.sha }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        type: string
        default: manual
      subscription_diagnostic:
        type: boolean
        default: false
      diagnostic_linux_only:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'examples/rust-integration/**'
      - 'scripts/check-rust-integrations.py'
      - 'scripts/prepare-rust-tests.py'
      - '.github/workflows/rust-integrations.yml'
permissions:
  contents: read
jobs:
  native:
    if: ${{ !inputs.subscription_diagnostic }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
        include:
          - runner: ubuntu-24.04
            baseline: linux-x86_64
          - runner: macos-15
            baseline: darwin-arm64
          - runner: macos-15-intel
            baseline: darwin-x86_64
          - runner: windows-2022
            baseline: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Prepare short private test directory
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prepare-rust-tests.py
      - name: Check real native backends
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo test --locked -p gcoms -p gcoms-runtime -p gcoms-sdk -p gcoms-file-transfer --all-features -- --test-threads=1
      - name: Check and measure isolated consumer graphs
        env:
          CARGO_BUILD_JOBS: '2'
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check-rust-integrations.py --measure --output integration-evidence --baseline docs/evidence/rust-integrations-20260921/${{ matrix.baseline }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-integrations-${{ matrix.runner }}-${{ github.sha }}
          path: integration-evidence/
          if-no-files-found: error

  subscription-diagnostic:
    if: ${{ inputs.subscription_diagnostic }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.diagnostic_linux_only && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15","macos-15-intel","windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare the existing protected-loopback topology
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          if [ "$RUNNER_OS" = macOS ]; then
            for host in 102 103 104 105 106 107; do
              sudo ifconfig lo0 alias 127.0.0.$host up
            done
          fi
          mkdir -p subscription-evidence
          git rev-parse HEAD > subscription-evidence/source.txt
      - name: Prepare short private test directory
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prepare-rust-tests.py
      - name: Run unchanged subscription assertions with local diagnostic events
        shell: bash
        env:
          CARGO_BUILD_JOBS: '4'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          RUST_BACKTRACE: '1'
        run: |
          export GCOMS_SUBSCRIPTION_TEST_METRICS="$GITHUB_WORKSPACE/subscription-evidence/metrics.jsonl"
          set +e
          cargo +1.98.0 test --locked -p gcoms-node --all-features --lib protected_routes -- --test-threads=1 --nocapture > subscription-evidence/check.log 2>&1
          result=$?
          echo "$result" > subscription-evidence/exit.txt
          tail -120 subscription-evidence/check.log
          exit "$result"
      - name: Check strict node Clippy
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_JOBS: '4'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo +1.98.0 clippy --locked -p gcoms-node --all-features --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protected-subscription-diagnostic-${{ matrix.runner }}-${{ github.sha }}
          path: subscription-evidence/
          if-no-files-found: error
