name: Rust application integrations
run-name: GComs SDK Rust ${{ inputs.request_id || github.sha }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        type: string
        default: manual
      subscription_diagnostic:
        type: boolean
        default: false
      diagnostic_linux_only:
        type: boolean
        default: false
      local_pipe_diagnostic:
        type: boolean
        default: false
      mac_overlay_diagnostic:
        type: boolean
        default: false
      machine_scope_diagnostic:
        description: Run only the cold member recovery regression on Intel Mac
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'examples/rust-integration/**'
      - 'scripts/check-rust-integrations.py'
      - 'scripts/sdk_size_policy.py'
      - 'scripts/tests/rust_integration_size_test.py'
      - 'scripts/check-released-facade.py'
      - 'release/contracts/**'
      - 'scripts/prepare-rust-tests.py'
      - '.github/workflows/rust-integrations.yml'
permissions:
  contents: read
jobs:
  native:
    if: ${{ !inputs.subscription_diagnostic && !inputs.local_pipe_diagnostic && !inputs.mac_overlay_diagnostic && !inputs.machine_scope_diagnostic }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
        include:
          - runner: ubuntu-24.04
            baseline: linux-x86_64
          - runner: macos-15
            baseline: darwin-arm64
          - runner: macos-15-intel
            baseline: darwin-x86_64
          - runner: windows-2022
            baseline: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        id: rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Prepare short private test directory
        id: tests
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prepare-rust-tests.py
      - name: Check feature-release and stable size boundaries
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s scripts/tests -p rust_integration_size_test.py
      - name: Require clean source before native qualification
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain']), 'native source is not clean'"
      - name: Check real native backends
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
          GCOMS_FILE_RECOVERY_DIAGNOSTICS: '1'
        shell: bash
        run: |
          mkdir -p test-evidence/integration-evidence
          git rev-parse HEAD > test-evidence/integration-evidence/source.txt
          set +e
          cargo test --locked -p gcoms -p gcoms-runtime -p gcoms-sdk -p gcoms-file-transfer --all-features -- --test-threads=1 > test-evidence/integration-evidence/native.log 2>&1
          result=$?
          tail -100 test-evidence/integration-evidence/native.log
          exit "$result"
      - name: Retain completed backend diagnostics before size builds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          retention-days: 30
          name: native-backend-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-evidence/integration-evidence/native.log
            test-evidence/integration-evidence/source.txt
          if-no-files-found: error
      - name: Check and measure isolated consumer graphs
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.tests.outcome == 'success' }}
        env:
          CARGO_BUILD_JOBS: '2'
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check-rust-integrations.py --measure --output test-evidence/integration-evidence --baseline docs/evidence/rust-integrations-20260921/${{ matrix.baseline }}.json
      - name: Verify clean measurement source and exact revision
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.tests.outcome == 'success' }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -c "import json,os,pathlib,subprocess; report=json.loads(pathlib.Path('test-evidence/integration-evidence/summary.json').read_text()); assert report['revision']==os.environ['GITHUB_SHA'] and report['dirty'] is False and report['passed'] is True; assert not subprocess.check_output(['git','status','--porcelain'])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          retention-days: 30
          name: rust-integrations-${{ matrix.runner }}-${{ github.sha }}
          path: test-evidence/integration-evidence/
          if-no-files-found: error

  subscription-diagnostic:
    if: ${{ inputs.subscription_diagnostic && !inputs.local_pipe_diagnostic && !inputs.mac_overlay_diagnostic && !inputs.machine_scope_diagnostic }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.diagnostic_linux_only && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-15","macos-15-intel","windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare the existing protected-loopback topology
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          if [ "$RUNNER_OS" = macOS ]; then
            for host in 102 103 104 105 106 107; do
              sudo ifconfig lo0 alias 127.0.0.$host up
            done
          fi
          mkdir -p subscription-evidence
          git rev-parse HEAD > subscription-evidence/source.txt
      - name: Prepare short private test directory
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prepare-rust-tests.py
      - name: Run unchanged subscription assertions with local diagnostic events
        shell: bash
        env:
          CARGO_BUILD_JOBS: '4'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          RUST_BACKTRACE: '1'
        run: |
          export GCOMS_SUBSCRIPTION_TEST_METRICS="$GITHUB_WORKSPACE/subscription-evidence/metrics.jsonl"
          set +e
          cargo +1.98.0 test --locked -p gcoms-node --all-features --lib protected_routes -- --test-threads=1 --nocapture > subscription-evidence/check.log 2>&1
          result=$?
          echo "$result" > subscription-evidence/exit.txt
          tail -120 subscription-evidence/check.log
          exit "$result"
      - name: Check strict node Clippy
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_JOBS: '4'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: cargo +1.98.0 clippy --locked -p gcoms-node --all-features --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protected-subscription-diagnostic-${{ matrix.runner }}-${{ github.sha }}
          path: subscription-evidence/
          if-no-files-found: error

  local-pipe-diagnostic:
    if: ${{ inputs.local_pipe_diagnostic && !inputs.mac_overlay_diagnostic && !inputs.machine_scope_diagnostic }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Prepare pinned native worker
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          python scripts/prepare-rust-tests.py
      - name: Qualify pipe preface and original failure control
        env:
          CARGO_BUILD_JOBS: '4'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: python scripts/check-local-pipe.py --output pipe-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-pipe-${{ github.sha }}
          path: pipe-evidence/
          if-no-files-found: error

  mac-overlay-diagnostic:
    if: ${{ inputs.mac_overlay_diagnostic && !inputs.machine_scope_diagnostic }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
      - name: Prepare pinned native worker
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          python3 scripts/prepare-rust-tests.py
      - name: Compare unchanged overlay with explicit disposable port resources
        env:
          CARGO_BUILD_JOBS: '4'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: python3 scripts/check-mac-overlay-resources.py --output overlay-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-overlay-${{ github.sha }}
          path: overlay-evidence/
          if-no-files-found: error

  machine-scope-diagnostic:
    if: ${{ inputs.machine_scope_diagnostic }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Prepare pinned native worker
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          python3 scripts/prepare-rust-tests.py
      - name: Repeat the exact cold member recovery regression
        run: python3 scripts/check-machine-scope-recovery.py --output test-evidence/machine-scope-recovery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: machine-scope-recovery-${{ github.sha }}
          path: test-evidence/machine-scope-recovery/
          if-no-files-found: error
