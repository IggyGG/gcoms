worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=push:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 8080;
        client_max_body_size 8k;
        client_body_buffer_size 8k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        send_timeout 5s;
        keepalive_timeout 5s;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location ~ ^/v1/(register|unregister|events)$ {
            limit_except POST { deny all; }
            limit_req zone=push burst=40 nodelay;
            limit_req_status 429;
            limit_conn connections 24;
            proxy_connect_timeout 2s;
            proxy_read_timeout 12s;
            proxy_send_timeout 5s;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_pass http://127.0.0.1:8791;
        }
        location / { return 404; }
    }
}
