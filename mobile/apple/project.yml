name: GComsPreview
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  GComsPackage:
    path: ${GCOMS_PACKAGE_PATH}
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  Baseline:
    type: application
    platform: iOS
    sources: [Sample]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: boo.gcoms.preview.baseline
  Preview:
    type: application
    platform: iOS
    sources: [Sample]
    dependencies:
      - package: GComsPackage
        product: GComs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: boo.gcoms.preview.sdk
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: GCOMS_ENABLED
  PreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/GComsTests]
    dependencies:
      - target: Preview
      - package: GComsPackage
        product: GComs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: boo.gcoms.preview.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: GCOMS_ENABLED
schemes:
  Preview:
    build:
      targets:
        Preview: all
        PreviewTests: [test]
    test:
      targets: [PreviewTests]
  Baseline:
    build:
      targets:
        Baseline: all
